version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      csec_bridge:
        ipv4_address: 172.28.0.2

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.3.10
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open_webui_storage:/app/backend/data
    networks:
      csec_bridge:
        ipv4_address: 172.28.0.3
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  jupyterlab:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    image: csec2300/jupyter-adk:latest
    container_name: jupyterlab
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - .:/home/jovyan/work
    networks:
      csec_bridge:
        ipv4_address: 172.28.0.4
    environment:
      - OLLAMA_API_BASE=http://ollama:11434/v1
    depends_on:
      - ollama

networks:
  csec_bridge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  ollama_storage:
    driver: local
  open_webui_storage:
    driver: local
