version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: capstone_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: capstone_open_webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  jupyterlab:
    image: jupyter/datascience-notebook:latest
    container_name: capstone_jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./docs:/home/jovyan/work
    restart: unless-stopped

volumes:
  ollama_data:
